<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a20"/>
      <stop offset="50%" stop-color="#121316"/>
      <stop offset="100%" stop-color="#0a0b0d"/>
    </linearGradient>
    <linearGradient id="tufGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffbe3b"/>
      <stop offset="50%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#cc6600"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9900" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff9900" stop-opacity="0"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="128" height="128" rx="24" fill="url(#bgGrad)"/>
  <rect width="126" height="126" x="1" y="1" rx="23" fill="none" stroke="#2d323e" stroke-width="1.5"/>

  <!-- Tech corner notches -->
  <path d="M 12 28 L 28 12" stroke="#ff9900" stroke-width="2" stroke-opacity="0.6"/>
  <path d="M 116 28 L 100 12" stroke="#ff9900" stroke-width="2" stroke-opacity="0.6"/>
  <path d="M 12 100 L 28 116" stroke="#ff9900" stroke-width="2" stroke-opacity="0.6"/>
  <path d="M 116 100 L 100 116" stroke="#ff9900" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Inner Hexagon Grid -->
  <polygon points="64,18 102,38 102,90 64,110 26,90 26,38" fill="none" stroke="#222630" stroke-width="2"/>
  <polygon points="64,22 98,40 98,88 64,106 30,88 30,40" fill="#15171d" stroke="#ff9900" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- TUF Gaming Wings Logo -->
  <g transform="translate(0, 2)" filter="url(#neonGlow)">
    <!-- Central Shield / Spine -->
    <polygon points="64,36 68,44 68,82 64,88 60,82 60,44" fill="url(#tufGold)"/>

    <!-- Left Wing Outer -->
    <polygon points="56,42 42,42 36,54 48,54 56,48" fill="url(#tufGold)"/>
    <!-- Left Wing Mid -->
    <polygon points="56,52 40,58 38,68 50,66 56,60" fill="url(#tufGold)"/>
    <!-- Left Wing Bottom -->
    <polygon points="56,64 42,72 44,80 56,76" fill="url(#tufGold)"/>

    <!-- Right Wing Outer -->
    <polygon points="72,42 86,42 92,54 80,54 72,48" fill="url(#tufGold)"/>
    <!-- Right Wing Mid -->
    <polygon points="72,52 88,58 90,68 78,66 72,60" fill="url(#tufGold)"/>
    <!-- Right Wing Bottom -->
    <polygon points="72,64 86,72 84,80 72,76" fill="url(#tufGold)"/>

    <!-- Center Wing Accent Points -->
    <polygon points="64,92 61,86 67,86" fill="#ffbe3b"/>
  </g>

  <!-- Aura RGB Glow Indicator at bottom -->
  <circle cx="64" cy="104" r="3" fill="#ff9900"/>
  <circle cx="54" cy="103" r="2.5" fill="#00e5ff"/>
  <circle cx="74" cy="103" r="2.5" fill="#ff0055"/>
</svg>
