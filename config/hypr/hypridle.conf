# ==============================================================================
# hypridle.conf - Wayland Idle Management Daemon for Hyprland
# ==============================================================================
# Managed by DotFiles - Paused automatically when Caffeine Mode is ON
# ==============================================================================

general {
    lock_cmd = loginctl lock-session
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 1. Dim display brightness to 20% after 2.5 minutes (150s) of inactivity
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 20%
    on-resume = brightnessctl -r
}

# 2. Turn off display via DPMS after 5 minutes (300s) of inactivity
listener {
    timeout = 300
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 3. Lock session after 10 minutes (600s) of inactivity
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 4. Suspend system after 20 minutes (1200s) of inactivity
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
