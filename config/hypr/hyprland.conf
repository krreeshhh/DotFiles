exec-once = bash /home/Krish/.config/my-desktop/wallpaper/apply-wallpaper.sh
exec-once = bash -c "if command -v quickshell >/dev/null 2>&1; then bash /home/Krish/.config/quickshell/launch.sh; else bash /home/Krish/.config/waybar/launch.sh; fi"
exec-once = walker --gapplication-service
exec-once = /home/Krish/.local/bin/clipse -listen
exec-once = python3 /home/Krish/.config/hypr/scripts/autostart.py
env = COLOR_SCHEME,prefer-dark
env = GTK_USE_PORTAL,1
env = QT_QPA_PLATFORMTHEME,gtk3
env = QT_QPA_PLATFORM,wayland;xcb
env = QML_IMPORT_PATH,/home/Krish/.config/quickshell:/home/Krish/.config/quickshell/plugins
env = QML2_IMPORT_PATH,/home/Krish/.config/quickshell:/home/Krish/.config/quickshell/plugins

# Clipse & Yazi Floating Window Rules
windowrulev2 = float, title:(^clipse-clipboard$)
windowrulev2 = size 640 540, title:(^clipse-clipboard$)
windowrulev2 = center, title:(^clipse-clipboard$)
windowrulev2 = pin, title:(^clipse-clipboard$)
windowrulev2 = stayfocused, title:(^clipse-clipboard$)

windowrulev2 = float, title:(^yazi-filemanager$)
windowrulev2 = size 1100 700, title:(^yazi-filemanager$)
windowrulev2 = center, title:(^yazi-filemanager$)

# File Managers Glass Blur & Transparency
windowrulev2 = opacity 0.88 0.80, class:(org.kde.dolphin)
windowrulev2 = opacity 0.88 0.80, class:(com.mitchellh.ghostty)
windowrulev2 = opacity 0.88 0.80, class:(org.gnome.Nautilus)
windowrulev2 = opaque, class:(thunar)

# File Pickers & Dialogs Floating Window Rules & Transparency
windowrulev2 = float, title:^(Open.*|Save.*|Choose.*|Select.*|File Upload|All Files)$
windowrulev2 = size 860 540, title:^(Open.*|Save.*|Choose.*|Select.*|File Upload|All Files)$
windowrulev2 = center, title:^(Open.*|Save.*|Choose.*|Select.*|File Upload|All Files)$
windowrulev2 = opacity 0.88 0.80, title:^(Open.*|Save.*|Choose.*|Select.*|File Upload|All Files)$

windowrulev2 = float, class:^(xdg-desktop-portal-.*)$
windowrulev2 = size 860 540, class:^(xdg-desktop-portal-.*)$
windowrulev2 = center, class:^(xdg-desktop-portal-.*)$
windowrulev2 = opacity 0.88 0.80, class:^(xdg-desktop-portal-.*)$
windowrulev2 = opacity 0.88 0.80, class:(xdg-desktop-portal-gtk)


# Screenshots
bind = , Print, exec, bash /home/Krish/.config/hypr/scripts/screenshot.sh area
bind = SHIFT, Print, exec, bash /home/Krish/.config/hypr/scripts/screenshot.sh full

# Brightness & Audio Keys (5% increments with Windows-style OSD)
bindle = , F7, exec, bash /home/Krish/.config/hypr/scripts/brightness.sh down
bindle = , F8, exec, bash /home/Krish/.config/hypr/scripts/brightness.sh up
bindle = , XF86MonBrightnessDown, exec, bash /home/Krish/.config/hypr/scripts/brightness.sh down
bindle = , XF86MonBrightnessUp, exec, bash /home/Krish/.config/hypr/scripts/brightness.sh up
bindle = , XF86AudioRaiseVolume, exec, bash /home/Krish/.config/hypr/scripts/volume.sh up
bindle = , XF86AudioLowerVolume, exec, bash /home/Krish/.config/hypr/scripts/volume.sh down
bindle = , XF86AudioMute, exec, bash /home/Krish/.config/hypr/scripts/volume.sh mute
bindle = , XF86AudioMicMute, exec, bash /home/Krish/.config/hypr/scripts/volume.sh mic-mute



# Wallpaper Picker, App Launcher, Clipboard & File Managers
bind = SUPER, W, exec, bash /home/Krish/.config/my-desktop/wallpaper/wallpaper-picker.sh
bind = SUPER, SPACE, exec, quickshell ipc call shell toggleAppLauncher
bind = SUPER, V, exec, ghostty --title=clipse-clipboard -e /home/Krish/.local/bin/clipse
bind = SUPER, E, exec, dolphin
bind = SUPER SHIFT, E, exec, /home/Krish/.local/bin/strata
bind = SUPER, Y, exec, ghostty --title=yazi-filemanager -e /home/Krish/.local/bin/yazi

# Quickshell Glass & Blur Layer Rules
layerrule = blur, quickshell
layerrule = ignorealpha 0.2, quickshell
layerrule = blurpopups, quickshell
layerrule = ignorezero, quickshell
layerrule = noanim, quickshell

# Rofi App Launcher Layer Rules
layerrule = blur, rofi
layerrule = ignorealpha 0.2, rofi

# nwg-bar Power Menu Layer Rules
layerrule = blur, nwg-bar
layerrule = ignorealpha 0.2, nwg-bar
layerrule = blurpopups, nwg-bar
layerrule = blur, gtk-layer-shell
layerrule = ignorealpha 0.2, gtk-layer-shell


