# ==============================================================================
# hyprlock.conf - Material You Dynamic GPU-Accelerated Screen Locker
# ==============================================================================

source = /home/Krish/.config/my-desktop/theme/colors-hyprland.conf

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Material Glass Card Container
shape {
    monitor =
    size = 380, 440
    color = rgba(25, 22, 20, 0.60)
    rounding = 24
    border_size = 1
    border_color = rgba(255, 255, 255, 0.12)
    position = 0, 0
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 10
    shadow_color = rgba(0, 0, 0, 0.45)
}

# Clock (Hours & Minutes)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $primary
    font_size = 56
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 130
    halign = center
    valign = center
}

# Date (Day, Month Date)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(255, 255, 255, 0.85)
    font_size = 14
    font_family = JetBrainsMono Nerd Font Medium
    position = 0, 75
    halign = center
    valign = center
}

# User Avatar / Icon + Name
label {
    monitor =
    text =   $USER
    color = rgba(255, 255, 255, 0.90)
    font_size = 15
    font_family = JetBrainsMono Nerd Font SemiBold
    position = 0, 15
    halign = center
    valign = center
}

# Password Input Field
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.25
    dots_center = true
    dots_rounding = -1
    outer_color = $primary
    inner_color = rgba(30, 26, 23, 0.80)
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffff88">󰌾  Enter Password...</span>
    hide_input = false
    rounding = 16
    check_color = $secondary
    fail_color = rgb(255, 107, 107)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 200
    capslock_color = $secondary
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    position = 0, -60
    halign = center
    valign = center
}

# Bottom Status / Lock Hint
label {
    monitor =
    text = 󰌾 Locked Session
    color = rgba(255, 255, 255, 0.45)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 0, -140
    halign = center
    valign = center
}
